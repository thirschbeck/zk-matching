<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2740">
<title>ZK Professionals · Stellenmatching</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--blau:#0f2740;--blau2:#1b4a72;--akzent:#c8a24a;--hell:#f4f6f9;--linie:#dfe4ea;--ok:#1f7a48;--warn:#a8621b;--rot:#a32121;--grau:#6b7785}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--hell);color:#15212e}
header{position:sticky;top:0;z-index:20;background:var(--blau);color:#fff;padding:10px 12px 8px}
header h1{margin:0;font-size:16px;letter-spacing:.2px}
header .stand{font-size:11.5px;opacity:.82;margin-top:2px}
header .werkzeuge{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 10px;font-size:12.5px}
nav{position:sticky;top:78px;z-index:19;background:#fff;border-bottom:1px solid var(--linie);display:flex;overflow-x:auto;gap:2px;padding:0 6px}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:9px 10px;font-size:12.5px;color:var(--grau);white-space:nowrap}
nav button.aktiv{color:var(--blau);border-bottom-color:var(--akzent);font-weight:600}
main{padding:12px 12px 90px;max-width:1100px;margin:0 auto}
h2{font-size:14px;margin:2px 0 10px;text-transform:uppercase;letter-spacing:.6px;color:var(--blau2)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.kpi div{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:8px 10px}
.kpi .n{font-size:20px;font-weight:700;color:var(--blau)}
.kpi .l{font-size:11px;color:var(--grau);line-height:1.25}
.karte{background:#fff;border:1px solid var(--linie);border-radius:11px;padding:10px 11px;margin-bottom:9px}
.karte .titel{font-weight:700;font-size:14.5px;color:var(--blau)}
.karte .zeile{font-size:12.5px;color:#33475c;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:#eef2f6;color:#3b4d61;border:1px solid #e2e8ee}
.tag.blue{background:#e8f1fb;border-color:#cfe1f5;color:#1c4d7d}
.tag.white{background:#fdf4e3;border-color:#f2e2c4;color:#8a6116}
.tag.ok{background:#e9f6ee;border-color:#cfe9d9;color:#1f7a48}
.tag.warn{background:#fdf1e5;border-color:#f5ddc4;color:#a8621b}
.tag.rot{background:#fbeaea;border-color:#f3cfcf;color:#a32121}
.tag.grau{background:#eef0f3;color:#6b7785}
.knoepfe{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button.k{background:var(--blau);color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:12.5px}
button.k.hell{background:#eef2f6;color:var(--blau);border:1px solid var(--linie)}
button.k.gruen{background:var(--ok)}
button.k.gold{background:var(--akzent);color:#2a2005}
input,select,textarea{font:14px inherit;padding:8px;border:1px solid var(--linie);border-radius:8px;width:100%;background:#fff}
textarea{min-height:70px}
label{font-size:12px;color:var(--grau);display:block;margin:8px 0 3px}
.feld{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.feld{grid-template-columns:1fr}}
.tuch{position:fixed;inset:0;background:rgba(12,22,34,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.blatt{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:14px 14px 22px}
.blatt h3{margin:0 0 8px;font-size:15px}
.gate{max-width:340px;margin:14vh auto;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:20px}
.gate h1{font-size:17px;margin:0 0 4px;color:var(--blau)}
.gate p{font-size:12.5px;color:var(--grau);margin:0 0 12px}
.meld{font-size:12.5px;color:var(--rot);min-height:16px;margin-top:6px}
.fuss{font-size:12px;color:var(--grau);min-height:16px;margin:8px 0}
.such{display:flex;gap:6px;margin-bottom:10px}
.such input{flex:1}
.hinweis{font-size:11.5px;color:var(--grau);margin-top:5px}
details{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:8px 10px;margin-bottom:8px}
summary{font-size:13px;font-weight:600;color:var(--blau2)}
pre{white-space:pre-wrap;font:13px/1.45 inherit;background:#fbfcfd;border:1px solid var(--linie);border-radius:8px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>ZK Professionals · Stellenmatching</h1>
  <div class="stand" id="stand">wird geladen …</div>
  <div class="werkzeuge" id="werkzeuge"></div>
</header>
<nav id="reiter"></nav>
<main id="inhalt"></main>
<script>
"use strict";
/* ---------- Zugang ---------- */
const BUCKET = "HuCDKH1zjs9QPg6yTPeVqH";
const URL_DATEN = "https://kvdb.io/" + BUCKET + "/zk-app-daten";
const URL_STATUS = "https://kvdb.io/" + BUCKET + "/zk-app-status";
const URL_NEU = "https://kvdb.io/" + BUCKET + "/zk-app-neukunden";
const ITER = 200000, KDF = "pbkdf2-sha256", VERSION = 1;

let schluessel = null, SALT = null, daten = null, status = null, neukunden = null;
let tab = "arbeit", filter = null, suche = "";

/* ---------- Krypto ---------- */
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyAus(passwort, saltB64, iter) {
  const grund = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(saltB64), iterations: iter || ITER, hash: "SHA-256" },
    grund, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function entschluesseln(huelle, passwort) {
  const k = await keyAus(passwort, huelle.salt, huelle.iter);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(huelle.iv) }, k, b64d(huelle.ct));
  return JSON.parse(new TextDecoder().decode(klar));
}
async function verschluesseln(objekt, k) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(objekt)));
  return { v: VERSION, kdf: KDF, iter: ITER, salt: SALT, iv: b64e(iv), ct: b64e(ct) };
}

/* ---------- Speicher ---------- */
async function hole(url) {
  const r = await fetch(url + "?z=" + Date.now(), { cache: "no-store" });
  if (!r.ok) return null;
  const t = (await r.text()).trim();
  if (!t) return null;
  return JSON.parse(t);
}
async function lege(url, huelle) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(huelle) });
  return r.ok;
}
async function anmelden(passwort) {
  const h = await hole(URL_DATEN);
  if (!h) throw new Error("Die Daten sind gerade nicht erreichbar.");
  let inhalt;
  try { inhalt = await entschluesseln(h, passwort); }
  catch (e) { throw new Error("Passwort stimmt nicht."); }
  schluessel = await keyAus(passwort, h.salt, h.iter);
  SALT = h.salt;
  daten = inhalt;
  const s = await hole(URL_STATUS);
  status = (s ? await entschluesseln(s, passwort).catch(() => null) : null) || { rows: {}, stelle: {}, profil: {}, stand: 0 };
  status.rows = status.rows || {}; status.stelle = status.stelle || {}; status.profil = status.profil || {};
  const n = await hole(URL_NEU);
  neukunden = (n ? await entschluesseln(n, passwort).catch(() => null) : null) || { rows: {}, stand: 0 };
  neukunden.rows = neukunden.rows || {};
}
async function statusSpeichern() {
  status.stand = Date.now();
  const ok = await lege(URL_STATUS, await verschluesseln(status, schluessel));
  setFuss(ok ? "Gespeichert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "Speichern fehlgeschlagen – bitte nochmal.");
  return ok;
}
async function neukundenSpeichern() {
  neukunden.stand = Date.now();
  const ok = await lege(URL_NEU, await verschluesseln(neukunden, schluessel));
  setFuss(ok ? "Neukunden-Blatt gespeichert." : "Speichern fehlgeschlagen – bitte nochmal.");
  return ok;
}
/* Zeile im Statusspeicher (Art: arbeit | bestand | eingang | zulauf | nachkontrolle | nachfass | profil) */
function st(art, id) { status.rows[art] = status.rows[art] || {}; status.rows[art][id] = status.rows[art][id] || {}; return status.rows[art][id]; }
function stSet(art, id, feld, wert) { const r = st(art, id); if (wert === "" || wert == null) delete r[feld]; else r[feld] = wert; r._t = Date.now(); statusSpeichern(); }
function nk(id) { neukunden.rows[id] = neukunden.rows[id] || {}; return neukunden.rows[id]; }
/* ---------- Hilfen ---------- */
const q = (s, r) => (r || document).querySelector(s);
const qa = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* ---------- Zeilen, Kennungen, Berufsbild ---------- */
function R(z, feld) { return z && z[feld] != null ? z[feld] : ""; }
function kennung(z, felder) {
  const s = felder.map(f => String(R(z, f)), ).join("|").toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").slice(0, 46);
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return s + "~" + (h >>> 0).toString(36);
}
const kArt = z => kennung(z, ["Bewerber", "Niederlassung"]);
const kBest = z => kennung(z, ["Bewerber", "unsere offene Stelle", "Kunde (Bestand)"]);
const kEingang = z => kennung(z, ["Bewerber", "Stelle", "Eingang"]);
const kZulauf = z => kennung(z, ["Bewerber", "beworben auf", "Eingang"]);
const kNachk = z => kennung(z, ["Bewerber", "Stelle / Anlass", "Arbeitgeber"]);
const kNachf = z => kennung(z, ["Bewerber", "beworben auf"]);
const kLead = z => kennung(z, ["Bewerber", "Unternehmen (Neukunde)", "Anlass / Stelle"]);
const kPerson = name => String(name || "").toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").slice(0, 60);

const VERTEIDIGUNG = /hensoldt|airbus defence|mbda|rheinmetall|diehl|esg |iabg|rohde|thales|leonardo|knds|ffg|atlas elektronik|krauss|heckler|defence|defense|bundeswehr|bwb|dstl|isr|optronik|prec|sens/;
const verteidigung = z => VERTEIDIGUNG.test(String(R(z, "Kunde (Bestand)") || R(z, "Kunde") || R(z, "Unternehmen (Neukunde)") || R(z, "Arbeitgeber") || R(z, "Stelle / Anlass") || "").toLowerCase());
const istBlue = z => /blue/i.test(String(R(z, "Blue/White")));

/* ---------- Bewerberprofil (Kriterien) ---------- */
function pr(name) { const k = kPerson(name); status.profil[k] = Object.assign({ cv: null }, status.profil[k] || {}); return status.profil[k]; }
function prSet(name, feld, wert) {
  const p = pr(name);
  if (wert === "" || wert == null) delete p[feld]; else p[feld] = wert;
  p._t = Date.now();
  statusSpeichern();
}
function fehlendePunkte(name, z) {
  const p = pr(name), aus = [];
  if (!p.ausbildung) aus.push("Ausbildung fehlt");
  else if (!p.ausbildung_geprueft) aus.push("Ausbildung noch nicht geprüft");
  if (!p.taetigkeit) aus.push("Tätigkeit fehlt");
  else if (!p.taetigkeit_klar) aus.push("Tätigkeit nicht klar");
  if (!p.studium && !p.ausbildung) aus.push("weder Ausbildung noch Studium");
  if (!p.sap && !p.google && !p.m365) aus.push("keine IT-Kenntnisse (SAP/M365/Google)");
  if (!p.spez) aus.push("keine Spezialisierung");
  if (verteidigung(z) && !p.suep) aus.push("ZÜP/Ü2/SÜG fehlt (Verteidigung)");
  if (!p.cv) aus.push("kein Lebenslauf");
  if (!p.profil) aus.push("Profil noch nicht geschrieben");
  return aus;
}
function profilStand(name, z) {
  const offen = fehlendePunkte(name, z).length;
  return offen === 0 ? "vollständig" : offen + " Punkt(e) offen";
}

/* ---------- Reiter ---------- */
const REITER = [
  ["arbeit", "Arbeitsliste"], ["eingang", "Eingang"], ["matching", "Matching"],
  ["neukunden", "Neukunden"], ["zulauf", "Zulauf ohne Daten"], ["nachkontrolle", "unter 65 %"],
  ["nachfass", "Nachfassen"], ["regel", "Regel & Text"], ["auswertung", "Auswertung"]
];
const FELDER = {
  arbeit: ["Region", "Blue/White", "Bewerber", "Wohnort", "Zielrolle / Beruf", "Niederlassung", "im System seit", "Bewerbung geprüft", "Vorhandene Kunden", "Neukunden-Leads", "Nächster Schritt", "Verantwortlicher", "Ergebnis"],
  bestand: ["Region", "Blue/White", "Bewerber", "Wohnort", "km", "unsere offene Stelle", "Kunde (Bestand)", "Ort Einsatz", "Niederlassung", "Titelbezug", "Einschätzung", "Kunde angesprochen", "Ergebnis"],
  eingang: ["Eingang", "Bewerber", "Stelle", "Kunde", "Niederlassung", "Status", "Recruiter", "Match Bestand", "Match neue Stellen"],
  zulauf: ["Bewerber", "beworben auf", "Kunde", "Niederlassung", "Eingang", "Status", "Recruiter", "Wohnort", "Berufsrichtung", "Was fehlt", "Erledigt"],
  nachkontrolle: ["Region", "Blue/White", "Bewerber", "Stelle / Anlass", "Arbeitgeber", "Passung", "Quelle", "Grund"],
  nachfass: ["Niederlassung", "Bewerber", "beworben auf", "Wohnort", "Berufsrichtung", "Fehlt noch", "Recruiter", "nachgefasst am", "Erledigt"],
  leads: ["Region", "Blue/White", "Bewerber", "Zielrolle / Beruf", "Wohnort", "Unternehmen (Neukunde)", "Anlass / Stelle", "Passung", "Link", "Kontaktweg", "Kunde A/B", "Ansprechpartner", "Kontakt aufgenommen", "Ergebnis", "Notiz"]
};
const KM_MAX = 60;

function setFuss(t) { const f = q("#fuss"); if (f) f.textContent = t; }
function schluesselWert(z) { return R(z, "Bewerber") + " " + R(z, "Wohnort"); }
function passtSuche(z) {
  if (!suche) return true;
  const s = suche.toLowerCase();
  return Object.keys(z).some(k => String(z[k]).toLowerCase().includes(s));
}
function kopiere(text) {
  navigator.clipboard.writeText(text).then(() => setFuss("Kopiert – kann eingefügt werden."), () => setFuss("Kopieren ging nicht, bitte Text markieren."));
}
function kzListe() {
  const k = daten && daten.kennzahlen;
  if (!k) return [];
  if (Array.isArray(k)) return k.map(x => [x[0], x[1]]);
  return Object.entries(k).map(([a, b]) => [a.replace(/_/g, " "), b]);
}
/* ---------- Aufbau ---------- */
function zeichne() {
  q("#reiter").innerHTML = REITER.map(([k, t]) => `<button data-t="${k}" class="${k === tab ? "aktiv" : ""}">${esc(t)}</button>`).join("");
  q("#stand").textContent = (daten && daten.stand ? "Stand " + daten.stand : "") + " · " + KM_MAX + " km · " +
    kzListe().slice(0, 4).map(k => k[0] + " " + k[1]).join(" · ") +
    (neukunden && neukunden.stand ? " · Neukunden-Blatt " + new Date(neukunden.stand).toLocaleDateString("de-DE") : "");
  q("#werkzeuge").innerHTML = `<button data-h="neu">Aktualisieren</button><button data-h="bm">Abmelden</button>`;
  q("#inhalt").innerHTML = `<div class="such"><input id="suchfeld" placeholder="Suchen (Name, Ort, Kunde, Rolle …)" value="${esc(suche)}"></div>
    <div class="kpi">${kzListe().map(k => `<div><div class="n">${esc(k[1])}</div><div class="l">${esc(k[0])}</div></div>`).join("")}</div>
    <div class="fuss" id="fuss"></div><div id="liste"></div>`;
  verdrahten();
  liste();
}
function verdrahten() {
  qa("#reiter button").forEach(b => b.onclick = () => { tab = b.dataset.t; zeichne(); });
  qa("[data-h]").forEach(b => b.onclick = () => {
    const h = b.dataset.h;
    if (h === "bm") { sessionStorage.removeItem("zk_pass"); location.reload(); }
    else if (h === "neu") location.reload();
    else if (h === "zu") oeffne(null);
  });
  const s = q("#suchfeld");
  if (s) s.oninput = () => { suche = s.value.trim(); liste(); };
}
function liste() {
  const ziel = q("#liste");
  if (tab === "arbeit") ziel.innerHTML = ansichtArbeit();
  else if (tab === "eingang") ziel.innerHTML = ansichtEingang();
  else if (tab === "matching") ziel.innerHTML = ansichtMatching();
  else if (tab === "neukunden") ziel.innerHTML = ansichtNeukunden();
  else if (tab === "zulauf") ziel.innerHTML = ansichtZulauf();
  else if (tab === "nachkontrolle") ziel.innerHTML = ansichtNachkontrolle();
  else if (tab === "nachfass") ziel.innerHTML = ansichtNachfass();
  else if (tab === "regel") ziel.innerHTML = ansichtRegel();
  else ziel.innerHTML = ansichtAuswertung();
  verdrahten();
}
function kopfLeiste(arten) {
  const b = ["<div class=\"knoepfe\">"];
  b.push(`<button class="k ${filter === null ? "" : "hell"}" data-f="alle">Alle</button>`);
  arten.forEach(a => b.push(`<button class="k ${filter === a ? "" : "hell"}" data-f="${esc(a)}">${esc(a)}</button>`));
  b.push("</div>");
  return b.join("");
}
function tagsAus(z, name) {
  const t = [];
  t.push(`<span class="tag ${istBlue(z) ? "blue" : "white"}">${istBlue(z) ? "Blue Collar" : "White Collar"}</span>`);
  if (verteidigung(z)) t.push(`<span class="tag rot">Verteidigung · ZÜP/Ü2/SÜG</span>`);
  const p = pr(name), offen = fehlendePunkte(name, z);
  t.push(offen.length === 0 ? `<span class="tag ok">Profil vollständig</span>` : `<span class="tag warn">${offen.length} Punkt(e) offen</span>`);
  if (p.suep) t.push(`<span class="tag ${p.suep_status === "liegt vor" ? "ok" : "warn"}">${esc(p.suep)} ${esc(p.suep_status || "offen")}</span>`);
  if (p.sap) t.push(`<span class="tag">SAP</span>`);
  if (p.google) t.push(`<span class="tag">Google Workspace</span>`);
  if (p.m365) t.push(`<span class="tag">M365</span>`);
  if (p.spez) String(p.spez).split(",").map(s => s.trim()).filter(Boolean).slice(0, 4).forEach(s => t.push(`<span class="tag">${esc(s)}</span>`));
  if (p.cv) t.push(`<span class="tag ok">Lebenslauf</span>`);
  return `<div class="tags">${t.join("")}</div>`;
}
function knopfZeile(z, art, id, name) {
  const b = [];
  b.push(`<button class="k" data-p="${esc(name)}">Profil & Kriterien</button>`);
  if (art === "arbeit") b.push(`<button class="k hell" data-mat="${esc(name)}">Matching zeigen</button>`);
  if (art === "bestand") b.push(`<button class="k gruen" data-vor="${esc(id)}">Vorschlag erstellen</button>`);
  b.push(`<button class="k hell" data-rs="${esc(name)}">Rücksprache</button>`);
  return `<div class="knoepfe">${b.join("")}</div>`;
}
/* ---------- Arbeitsliste ---------- */
function ansichtArbeit() {
  const alle = (daten.arbeitsliste || []).filter(passtSuche);
  const zs = alle.filter(z => !filter || (filter === "Blue Collar" ? istBlue(z) : !istBlue(z)));
  let h = kopfLeiste(["Blue Collar", "White Collar"]);
  h += `<h2>Arbeitsliste · ${zs.length} Bewerber</h2>`;
  if (!zs.length) h += `<div class="karte">Keine Bewerber für diese Auswahl.</div>`;
  zs.forEach(z => {
    const id = kArt(z), name = R(z, "Bewerber"), p = pr(name), offen = fehlendePunkte(name, z);
    const geprueft = p.geprueft === "ja";
    h += `<div class="karte">
      <div class="titel">${esc(name)}</div>
      <div class="zeile">${esc(R(z, "Wohnort"))} · ${esc(R(z, "Zielrolle / Beruf"))} · ${esc(R(z, "Niederlassung"))} · im System seit ${esc(R(z, "im System seit"))}</div>
      <div class="zeile">Bestand: ${esc(R(z, "Vorhandene Kunden"))} · Neukunden: ${esc(R(z, "Neukunden-Leads"))} · ${esc(R(z, "Nächster Schritt"))}${R(z, "Verantwortlicher") ? " · " + esc(R(z, "Verantwortlicher")) : " · Verantwortlicher fehlt"}</div>
      ${tagsAus(z, name)}
      ${offen.length ? `<div class="zeile"><b>Was fehlt:</b> ${esc(offen.join(", "))}</div>` : ""}
      <div class="knoepfe">
        <button class="k ${geprueft ? "gruen" : "hell"}" data-g="${esc(id)}|${esc(name)}|geprueft">${geprueft ? "✓ Bewerbung geprüft" : "Bewerbung prüfen"}</button>
        <button class="k hell" data-e="arbeit|${esc(id)}">Bearbeiten</button>

      <div><label>Studienfach</label><input id="pr_studium_fach" value="${esc(p.studium_fach || "")}"></div>
      <div><label>Zertifikate / Weiterbildungen</label><input id="pr_zert" value="${esc(p.zert || "")}"></div>
      <div><label>Verfügbar ab</label><input id="pr_verfuegbar" value="${esc(p.verfuegbar || "")}"></div>
    </div>
    <label>IT-Kenntnisse</label>
    <div class="knoepfe">
      <button class="k ${p.sap ? "" : "hell"}" data-it="sap">SAP</button>
      <button class="k ${p.google ? "" : "hell"}" data-it="google">Google Workspace</button>
      <button class="k ${p.m365 ? "" : "hell"}" data-it="m365">M365</button>
    </div>
    <label>Spezialisierungen (mit Komma)</label>
    <input id="pr_spez" value="${esc(p.spez || "")}" placeholder="Konstruktion, CATIA V4, CATIA V5, Avionik, SPS …">
    <div class="feld">
      <div><label>Sicherheitsüberprüfung (Verteidigung)</label>
        <select id="pr_suep"><option value="">nicht nötig / offen</option>
        ${["ZÜP", "Ü2", "SÜG"].map(s => `<option ${p.suep === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div><label>Stand der Überprüfung</label>
        <select id="pr_suep_status"><option value="offen" ${p.suep_status === "offen" ? "selected" : ""}>beantragt/offen</option>
        <option value="läuft" ${p.suep_status === "läuft" ? "selected" : ""}>läuft</option>
        <option value="liegt vor" ${p.suep_status === "liegt vor" ? "selected" : ""}>liegt vor</option></select></div>
    </div>
    <label>Thema 1 (z. B. Gehaltsvorstellung, Wechselmotivation, Schichtbereitschaft)</label>
    <input id="pr_thema1" value="${esc(p.thema1 || "")}" placeholder="Thema und Stand">
    <label>Thema 2</label>
    <input id="pr_thema2" value="${esc(p.thema2 || "")}" placeholder="Thema und Stand">
    <label>Rücksprache mit dem Bewerber</label>
    <textarea id="pr_rueck" placeholder="Was wurde besprochen, was ist zu klären?">${esc(p.rueck || "")}</textarea>
    <label>Rücksprache am</label><input type="date" id="pr_rueck_am" value="${esc(p.rueck_am || "")}">
    <label>Lebenslauf (PDF oder Word, bis ca. 1,5 MB)</label>
    <input type="file" id="pr_cv" accept=".pdf,.doc,.docx,.rtf,.txt">
    <div class="hinweis" id="cvstand">${p.cv ? "hinterlegt: " + esc(p.cv.name) + " (" + Math.round(p.cv.groesse / 1024) + " KB, " + esc(p.cv.stand || "") + ")" : "kein Lebenslauf hinterlegt"}</div>
    <label>Profil für den Kunden (schreibt der Assistent aus dem Lebenslauf)</label>
    <textarea id="pr_profil" style="min-height:180px">${esc(p.profil || "")}</textarea>
    <div class="knoepfe">
      <button class="k" data-prs="1">Speichern</button>
      <button class="k gold" data-prf="1">${p.profil_angefordert ? "Profil wurde angefordert" : "Profil schreiben lassen"}</button>
      <button class="k hell" data-prd="1">Kundenvorlage erstellen</button>
      <button class="k hell" data-prr="1">Rücksprache-Mail</button>
    </div>
    <div class="hinweis">„Profil schreiben lassen" legt den Lebenslauf in die Warteschlange – das Profil steht dann hier, meist innerhalb einer Stunde.</div>
    <h3 style="margin-top:16px">Passende Stellen (automatisch, ${KM_MAX} km)</h3>
    ${(passt.bestand.length ? passt.bestand.map(z => `<div class="karte"><div class="titel">${esc(R(z, "unsere offene Stelle"))} <span class="tag ok">${esc(R(z, "km"))} km</span></div>
      <div class="zeile">${esc(R(z, "Kunde (Bestand)"))} · ${esc(R(z, "Ort Einsatz"))} · Titelbezug ${esc(R(z, "Titelbezug"))}</div>
      <div class="knoepfe"><button class="k hell" data-link="${esc(R(z, "Kunde (Bestand)") + "|" + R(z, "unsere offene Stelle") + "|" + R(z, "Ort Einsatz"))}">Stelle & Link</button>
      <button class="k gruen" data-vor="${esc(kBest(z))}">Vorschlag erstellen</button></div></div>`).join("") : `<div class="hinweis">Kein Treffer bei Bestandskunden im Umkreis.</div>`)}
    ${passt.leads.length ? `<h3>Neukunden mit passender Stelle</h3>` + passt.leads.map(z => `<div class="karte"><div class="titel">${esc(R(z, "Unternehmen (Neukunde)"))} <span class="tag ${/^a/i.test(String(R(z, "Kunde A/B"))) ? "ok" : "grau"}">${esc(R(z, "Kunde A/B"))}</span></div>
      <div class="zeile">${esc(R(z, "Anlass / Stelle"))} · Passung ${esc(R(z, "Passung"))}${R(z, "Ansprechpartner") ? " · " + esc(R(z, "Ansprechpartner")) : ""}</div>
      <div class="knoepfe">${R(z, "Link") ? `<button class="k hell" data-url="${esc(R(z, "Link"))}">Stellen-Link öffnen</button>` : ""}
      ${/^a/i.test(String(R(z, "Kunde A/B"))) ? `<button class="k gruen" data-nkvor="${esc(kLead(z))}">Anschreiben erstellen</button>` : `<span class="tag grau">kein Kaltkontakt</span>`}</div></div>`).join("") : ""}
    <div class="knoepfe"><button class="k hell" data-h="zu">Schließen</button></div></div></div>`, () => bindProfil(name));
}
function profilLesen(name) {
  const p = pr(name);
  [["pr_ausbildung", "ausbildung"], ["pr_ausbildung_geprueft", "ausbildung_geprueft"], ["pr_taetigkeit", "taetigkeit"],
   ["pr_taetigkeit_klar", "taetigkeit_klar"], ["pr_studium", "studium"], ["pr_studium_fach", "studium_fach"],
   ["pr_zert", "zert"], ["pr_verfuegbar", "verfuegbar"], ["pr_spez", "spez"], ["pr_suep", "suep"],
   ["pr_suep_status", "suep_status"], ["pr_thema1", "thema1"], ["pr_thema2", "thema2"], ["pr_rueck", "rueck"],
   ["pr_rueck_am", "rueck_am"], ["pr_profil", "profil"]].forEach(([id, feld]) => {
    const el = q("#" + id); if (!el) return;
    if (el.value === "") delete p[feld]; else p[feld] = el.value;
  });
  p._t = Date.now();
  return p;
}
function bindProfil(name) {
  qa("[data-it]").forEach(b => b.onclick = () => { const p = pr(name), f = b.dataset.it; if (p[f]) delete p[f]; else p[f] = "ja"; p._t = Date.now(); statusSpeichern(); oeffne(null); blattProfil(name); });
  q("#pr_cv").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1600000) { setFuss("Die Datei ist größer als 1,5 MB – bitte verkleinern."); return; }
    const fr = new FileReader();
    fr.onload = () => {
      const p = profilLesen(name);
      p.cv = { name: f.name, typ: f.type, groesse: f.size, stand: new Date().toISOString().slice(0, 10), b64: String(fr.result).split(",")[1] };
      p.profil_angefordert = new Date().toISOString();
      p._t = Date.now(); statusSpeichern();
      setFuss("Lebenslauf hinterlegt – das Profil wird jetzt geschrieben.");
      oeffne(null); blattProfil(name);
    };
    fr.readAsDataURL(f);
  };
  q("[data-prs]").onclick = () => {
    profilLesen(name); statusSpeichern(); setFuss("Profil gespeichert."); liste();
  };
  q("[data-prf]").onclick = () => {
    const p = pr(name);
    p.profil_angefordert = new Date().toISOString(); p._t = Date.now(); statusSpeichern();
    setFuss("Profil angefordert – steht in der Regel innerhalb einer Stunde hier.");
    oeffne(null); blattProfil(name);
  };
  q("[data-prd]").onclick = () => blattText("Kundenvorlage · " + name, profilAnKunde(name));
  q("[data-prr]").onclick = () => blattText("Rücksprache-Mail · " + name, entwurfRuecksprache(name));
}
function blattRuecksprache(name) {
  const p = pr(name);
  oeffne(`<div class="tuch" data-h="zu"><div class="blatt" onclick="event.stopPropagation()">
    <h3>Rücksprache · ${esc(name)}</h3>
    <label>Thema 1</label><input id="rs1" value="${esc(p.thema1 || "")}" placeholder="z. B. Gehaltswunsch, Schichtbereitschaft">
    <label>Thema 2</label><input id="rs2" value="${esc(p.thema2 || "")}" placeholder="z. B. Wechselmotivation, Umzug">
    <label>Notiz zur Rücksprache</label><textarea id="rsn" placeholder="Was ist besprochen, was offen?">${esc(p.rueck || "")}</textarea>
    <label>Rücksprache am</label><input type="date" id="rsd" value="${esc(p.rueck_am || "")}">
    <div class="knoepfe"><button class="k" data-rss="1">Speichern</button>
      <button class="k gold" data-rsm="1">Rücksprache-Mail</button>
      <button class="k hell" data-h="zu">Schließen</button></div></div></div>`, () => {
    q("[data-rss]").onclick = () => {
      const p2 = pr(name);
      [["rs1", "thema1"], ["rs2", "thema2"], ["rsn", "rueck"], ["rsd", "rueck_am"]].forEach(([id, f]) => {
        const el = q("#" + id); if (el.value === "") delete p2[f]; else p2[f] = el.value;
      });
      p2._t = Date.now(); statusSpeichern(); oeffne(null); setFuss("Rücksprache gespeichert."); liste();
    };
    q("[data-rsm]").onclick = () => blattText("Rücksprache-Mail · " + name, entwurfRuecksprache(name));
  });
}
/* ---------- Profile und Entwürfe ---------- */
function kriterienBlock(name, z) {
  const p = pr(name), zl = [];
  const zeig = (t, w) => { if (w) zl.push(t + ": " + w); };
  zeig("Ausbildung", (p.ausbildung || "") + (p.ausbildung_geprueft === "ja" ? " (geprüft)" : p.ausbildung ? " (Prüfung läuft)" : ""));
  zeig("Studium", p.studium === "ja" ? "abgeschlossen" + (p.studium_fach ? " – " + p.studium_fach : "") : "");
  zeig("Tätigkeit", p.taetigkeit);
  zeig("IT-Kenntnisse", [p.sap ? "SAP" : "", p.google ? "Google Workspace" : "", p.m365 ? "M365" : ""].filter(Boolean).join(", "));
  zeig("Spezialisierungen", p.spez);
  zeig("Zertifikate / Weiterbildungen", p.zert);
  zeig("Verfügbar ab", p.verfuegbar);
  const suep = p.suep ? (p.suep + " – Stand: " + (p.suep_status || "offen")) : (verteidigung(z) ? "ZÜP/Ü2/SÜG erforderlich, Stand klären" : "");
  zeig("Sicherheitsüberprüfung", suep);
  zeig("Wohnort", R(z, "Wohnort"));
  zeig("Zielrolle", R(z, "Zielrolle / Beruf"));
  zeig("Kragenfarbe", istBlue(z) ? "Blue Collar (gewerblich/technisch)" : "White Collar (kaufmännisch/ingenieurmäßig)");
  return zl.join("\n");
}
function profilAnKunde(name) {
  const passt = passendeFuer(name), z = passt.bestand[0] || (daten.arbeitsliste || []).find(x => String(R(x, "Bewerber")) === String(name)) || {};
  const p = pr(name), offen = fehlendePunkte(name, z);
  const kopf = [
    "KANDIDATENPROFIL (intern, Stand " + new Date().toLocaleDateString("de-DE") + ")",
    "",
    "Bewerber: " + name,
    "Position: " + (R(z, "Zielrolle / Beruf") || R(z, "unsere offene Stelle") || "—"),
    "Einsatzort/Wohnort: " + (R(z, "Ort Einsatz") || R(z, "Wohnort") || "—"),
    ""
  ];
  const mitte = [p.profil ? p.profil : "(Profil noch nicht geschrieben – im Profil-Blatt „Profil schreiben lassen“ antippen.)", "", "Eckdaten:", kriterienBlock(name, z)];
  const ende = ["", "Offene Punkte: " + (offen.length ? offen.join(", ") : "keine")];
  return kopf.concat(mitte).concat(ende).join("\n");
}
function entwurfVorschlag(z) {
  const name = R(z, "Bewerber"), p = pr(name);
  return "Betreff: " + (R(z, "unsere offene Stelle") || "Ihre offene Stelle") + " – Kandidatenvorschlag " + name + "\n\n" +
    "Guten Tag,\n\n" +
    "für Ihre Stelle „" + R(z, "unsere offene Stelle") + "\u201c in " + R(z, "Ort Einsatz") + " schlage ich Ihnen " + name + " vor.\n\n" +
    kriterienBlock(name, z) + "\n\n" +
    (p.profil ? "Zum Bewerber:\n" + p.profil + "\n\n" : "") +
    "Der Bewerber ist verfügbar" + (p.verfuegbar ? " ab " + p.verfuegbar : "") + " und wohnt " + R(z, "Wohnort") + " (" + R(z, "km") + " km zum Einsatzort).\n\n" +
    "Sagen Sie mir kurz Bescheid, ob wir den Lebenslauf und die Unterlagen zusenden sollen – dann liegt alles umgehend bei Ihnen.\n\n" +
    "Freundliche Grüße\nThomas Hirschbeck\nZK Professionals · HITO Holding GmbH";
}
function entwurfNeukunde(z) {
  const name = R(z, "Bewerber");
  return "Betreff: " + (R(z, "Anlass / Stelle")) + " – passender Bewerber aus unserem Netz\n\n" +
    "Guten Tag" + (R(z, "Ansprechpartner") ? " " + R(z, "Ansprechpartner") : "") + ",\n\n" +
    "wir sind auf Ihre Ausschreibung „" + R(z, "Anlass / Stelle") + "\u201c aufmerksam geworden" + (R(z, "Link") ? " (" + R(z, "Link") + ")" : "") + ".\n\n" +
    "Für diese Position haben wir " + name + " im Zugang, " + R(z, "Wohnort") + ", " + R(z, "Zielrolle / Beruf") + ":\n\n" +
    kriterienBlock(name, z) + "\n\n" +
    "Sollen wir Ihnen den Lebenslauf und ein Kurzprofil zusenden? Wir vermitteln Fach- und Führungskräfte in der Luftfahrt und im technischen Umfeld, Festanstellung und Überlassung.\n\n" +
    "Freundliche Grüße\nThomas Hirschbeck\nZK Professionals · HITO Holding GmbH";
}
function entwurfRuecksprache(name) {
  const passt = passendeFuer(name), z = passt.bestand[0] || (daten.arbeitsliste || []).find(x => String(R(x, "Bewerber")) === String(name)) || {};
  const p = pr(name), offen = fehlendePunkte(name, z);
  return "Betreff: Ihre Bewerbung – kurze Rückfragen\n\n" +
    "Guten Tag " + (name.split(" ").slice(-1)[0] || name) + ",\n\n" +
    "vielen Dank für Ihre Bewerbung. Für die Vorstellung bei unseren Kunden brauchen wir noch folgende Angaben:\n\n" +
    "- " + offen.join("\n- ") + "\n\n" +
    (p.thema1 ? "- " + p.thema1 + "\n" : "") + (p.thema2 ? "- " + p.thema2 + "\n" : "") + "\n" +
    "Eine kurze Antwort genügt, dann können wir Sie umgehend anbieten.\n\n" +
    "Freundliche Grüße\nThomas Hirschbeck\nZK Professionals · HITO Holding GmbH";
}
/* ---------- Start ---------- */
function tor(ml) {
  q("#inhalt").innerHTML = `<div class="gate"><h1>ZK Professionals · Stellenmatching</h1>
    <p>Zugang nur für freigegebene Mitarbeiter. Die Daten liegen verschlüsselt; ohne Passwort ist nichts lesbar.</p>
    <label>Konto</label><input id="ben" value="tobias" autocomplete="username">
    <label>Passwort</label><input id="pw" type="password" autocomplete="current-password">
    <div class="meld" id="fehler">${esc(ml || "")}</div>
    <div class="knoepfe"><button class="k" id="los" style="width:100%">Anmelden</button></div></div>`;
  q("#los").onclick = () => start(q("#pw").value);
  q("#pw").addEventListener("keydown", e => { if (e.key === "Enter") start(q("#pw").value); });
  q("#pw").focus();
}
async function start(passwort) {
  try {
    await anmelden(passwort);
    sessionStorage.setItem("zk_pass", passwort);
    zeichne();
  } catch (e) {
    q("#inhalt").innerHTML = `<div class="gate"><h1>ZK Professionals · Stellenmatching</h1>
      <label>Konto</label><input id="ben" value="tobias">
      <label>Passwort</label><input id="pw" type="password">
      <div class="meld">${esc(e.message)}</div>
      <div class="knoepfe"><button class="k" id="los" style="width:100%">Anmelden</button></div></div>`;
    q("#los").onclick = () => start(q("#pw").value);
    q("#pw").addEventListener("keydown", ev => { if (ev.key === "Enter") start(q("#pw").value); });
  }
}
const gemerkt = sessionStorage.getItem("zk_pass");
if (gemerkt) start(gemerkt); else tor();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
